name: Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile native input
        shell: cmd
        run: native_touch\build.cmd
      - run: python tools/run_portable_tests.py
